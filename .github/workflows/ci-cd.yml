name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Lint
        run: yarn lint

      - name: Test
        run: yarn test

      - name: Build
        run: yarn build

      - name: Build Docker image
        run: docker build -t agrichat-app:${{ github.sha }} .

      - name: Run security scan
        run: docker scan agrichat-app:${{ github.sha }}

      - name: Push to registry (if main branch)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin
          docker tag agrichat-app:${{ github.sha }} ${{ secrets.DOCKER_USERNAME }}/agrichat-app:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/agrichat-app:latest
